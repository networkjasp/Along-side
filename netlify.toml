# Netlify configuration — the repository root is the GitHub repo; only the
# /site folder is published, so /tools and /docs are never served publicly.
[build]
  publish = "site"
  command = ""

# Old internal pages: return 404 instead of serving them.
# portfolio-manager.html exposed a hard-coded password; audit-report.html
# repeated that password and made inaccurate security claims.
[[redirects]]
  from = "/portfolio-manager.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/audit-report.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/index%20(16).html"
  to = "/"
  status = 301
  force = true

# ---------- Security headers (every response) ----------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://static.wixstatic.com; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# ---------- Caching ----------
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
