# Netlify configuration — the repository root is the GitHub repo; only the
# /site folder is published, so /tools, /content and /docs are never served.
# The build renders the pages and bundles the Website Manager (/admin).
[build]
  publish = "site"
  command = "npm run build"

# Website Manager API: Netlify Functions + Netlify Blobs + Netlify Identity
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Old internal pages: return 404 instead of serving them.
# portfolio-manager.html exposed a hard-coded password; audit-report.html
# repeated that password and made inaccurate security claims.
[[redirects]]
  from = "/portfolio-manager.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/audit-report.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/index%20(16).html"
  to = "/"
  status = 301
  force = true

# ---------- Security headers (every response) ----------
# The Content-Security-Policy is set per page in a <meta> tag (public pages are
# strict; /admin has its own equally strict policy).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# ---------- Caching ----------
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# ---------- Website manager ----------
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
